services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: amaclone
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=5
      - -c
      - hot_standby=on
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d amaclone"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/amaclone?schema=public

  app:
    build:
      context: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/amaclone?schema=public
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-only-change-me}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}

  replica-1:
    profiles: ["replicas"]
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: replicator
    volumes:
      - pgdata-replica-1:/var/lib/postgresql/data
      - ./docker/postgres/replica:/scripts:ro
    command: ["sh", "/scripts/start-replica.sh"]

  replica-2:
    profiles: ["replicas"]
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: replicator
    volumes:
      - pgdata-replica-2:/var/lib/postgresql/data
      - ./docker/postgres/replica:/scripts:ro
    command: ["sh", "/scripts/start-replica.sh"]

volumes:
  pgdata:
  pgdata-replica-1:
  pgdata-replica-2:
